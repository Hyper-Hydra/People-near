      <span class="text-gray-400 text-lg leading-none">›</span>
    </header>

    <!-- ЛЕНТА -->
    <main id="screen-feed" class="px-4">
      <section class="grid grid-cols-2 gap-4 mt-2">
        <button type="button" class="tap text-left" onclick="filterCategory('Аренда')">
          <div class="aspect-[4/3] rounded-2xl bg-[var(--tile-bg)] overflow-hidden relative">
            <img src="./arenda.jpg" class="w-full h-full object-cover">
          </div>
          <span class="block text-center text-[14px] mt-1">Аренда</span>
        </button>
        <button type="button" class="tap text-left" onclick="filterCategory('Аренда')">
          <div class="aspect-[4/3] rounded-2xl bg-[var(--tile-bg)] overflow-hidden relative">
            <img src="./taxi.jpg" class="w-full h-full object-cover">
          </div>
          <span class="block text-center text-[14px] mt-1">Такси</span>
        </button>
        <button type="button" class="tap text-left" onclick="filterCategory('Доставка')">
          <div class="aspect-[4/3] rounded-2xl bg-[var(--tile-bg)] overflow-hidden relative">
            <img src="./dostavka.jpg" class="w-full h-full object-cover">
          </div>
          <span class="block text-center text-[14px] mt-1">Доставка</span>
        </button>
        <button type="button" class="tap text-left" onclick="filterCategory('Другое')">
          <div class="aspect-[4/3] rounded-2xl bg-[var(--tile-bg)] flex items-center justify-center gap-2">
            <span class="w-3.5 h-3.5 rounded-full bg-gray-600"></span>
            <span class="w-3.5 h-3.5 rounded-full bg-gray-600"></span>
            <span class="w-3.5 h-3.5 rounded-full bg-gray-600"></span>
          </div>
          <span class="block text-center text-[14px] mt-1">Другое</span>
        </button>
      </section>

      <div class="mt-5">
        <input id="search-input" type="text" placeholder="Поиск" class="w-full bg-[var(--input-bg)] rounded-full px-4 py-2.5 outline-none text-[15px]" />
      </div>

      <div id="orders-grid" class="mt-5 grid grid-cols-2 gap-3"></div>
      <div id="empty-state" class="hidden text-center mt-10 text-gray-500">Ничего не найдено</div>
    </main>

    <!-- ФОРМА -->
    <main id="screen-form" class="hidden px-4">
      <div class="mt-2 bg-white card-dashed rounded-3xl p-4 flex flex-col gap-3">
        <input id="ad-title" type="text" maxlength="120" placeholder="Название объявления"
               class="w-full rounded-2xl bg-[var(--input-bg)] text-gray-800 placeholder:text-gray-500 p-3 outline-none" />
        <textarea id="ad-description" rows="5" maxlength="2000" placeholder="Описание"
                  class="w-full resize-none rounded-2xl bg-[var(--input-bg)] text-gray-800 placeholder:text-gray-500 p-3 outline-none"></textarea>
        <div class="flex gap-2">
          <select id="ad-type" class="flex-1 min-w-0 bg-[var(--input-bg)] rounded-full px-4 py-2.5 outline-none text-gray-700">
            <option value="" selected disabled>Тип объявления</option>
            <option value="Аренда">Аренда</option>
            <option value="Такси">Такси</option>
            <option value="Доставка">Доставка</option>
            <option value="Другое">Другое</option>
          </select>
          <input id="ad-price" type="number" min="0" step="1" inputmode="numeric" placeholder="Цена"
                 class="w-24 shrink-0 bg-[var(--input-bg)] rounded-full px-4 py-2.5 outline-none text-gray-700" />
        </div>
        <p id="price-error" class="hidden -mt-1 text-sm text-red-600">Цена не может быть отрицательной.</p>
        <button id="publish-btn" disabled
                class="tap w-full bg-[var(--accent)] text-white rounded-full py-3 font-medium disabled:opacity-40">
          Опубликовать
        </button>
      </div>
    </main>

    <!-- ПРОФИЛЬ -->
    <main id="screen-profile" class="hidden px-4">
      <div class="bg-[var(--tile-bg)] rounded-3xl p-5 flex flex-col items-center gap-3 text-center">
        <div id="user-avatar" class="w-20 h-20 rounded-full bg-[var(--lavender)] text-[var(--lavender-text)] flex items-center justify-center text-3xl font-bold">?</div>
        <div>
          <h2 id="profile-name" class="text-xl font-bold">Имя пользователя</h2>
          <p id="profile-username" class="text-gray-500 text-sm">@username</p>
        </div>
        <div class="w-full mt-2 flex gap-2">
          <input id="profile-room" type="text" placeholder="Номер комнаты (напр. 412)"
                 class="flex-1 min-w-0 bg-white rounded-full px-4 py-2.5 text-sm outline-none" />
          <button id="save-room-btn" class="bg-[var(--accent)] text-white px-4 py-2.5 rounded-full text-sm font-medium tap shrink-0">Сохранить</button>
        </div>
      </div>

      <div class="flex items-center justify-between mt-6 mb-3">
        <h3 class="font-bold text-lg">Мои объявления</h3>
        <button id="archive-toggle-btn" type="button" class="tap flex items-center gap-1 text-[var(--accent-dark)] text-sm font-medium">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 13h4"/>
          </svg>
          <span id="archive-toggle-label">Архив</span>
        </button>
      </div>
      <div id="my-orders-list" class="flex flex-col gap-3"></div>
    </main>
  </div>

  <!-- ПОЛНАЯ ИНФОРМАЦИЯ -->
  <div id="detail-screen" class="hidden fixed inset-0 z-50 bg-white">
    <div class="max-w-md mx-auto h-full flex flex-col">
      <div class="px-4 pt-4 pb-3 flex items-center gap-3 border-b border-gray-100">
        <button id="detail-back" class="tap w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center" type="button" aria-label="Назад">
          <span class="text-2xl leading-none">‹</span>
        </button>
        <div class="font-semibold">Объявление</div>
      </div>

      <div id="detail-content" class="modal-scroll px-4 py-4"></div>
    </div>
  </div>

  <!-- ТОСТ -->
  <div id="toast"
       class="hidden fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] bg-gray-900 text-white rounded-full px-4 py-2 text-sm shadow-lg">
  </div>

  <!-- НИЖНЯЯ НАВИГАЦИЯ -->
  <div id="bottom-nav" class="fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-sm">
    <div class="max-w-md mx-auto relative fab-wrap nav-line">
      <button id="tab-form" type="button" class="tap fab-btn" aria-label="Разместить">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <div class="flex items-stretch safe-bottom pt-2.5">
        <button id="tab-feed" type="button" class="tap flex-1 flex flex-col items-center gap-1 pb-1.5 text-[var(--accent-dark)]">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>
          </svg>
          <span class="text-[11px] font-medium">Лента</span>
        </button>

        <div class="flex-1"></div>

        <button id="tab-profile" type="button" class="tap flex-1 flex flex-col items-center gap-1 pb-1.5 text-gray-400">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.6 3.6-6 8-6s8 2.4 8 6"/>
          </svg>
          <span class="text-[11px] font-medium">Профиль</span>
        </button>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
