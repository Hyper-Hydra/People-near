<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Общежитие №1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; }
  select { -webkit-appearance: none; appearance: none; }
  .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
  .tap:active { transform: scale(0.96); opacity: 0.85; }
  .modal-scroll { max-height: calc(100vh - 170px); overflow-y: auto; }
</style>
</head>
<body class="bg-white text-gray-900 overflow-x-hidden">
  <div class="max-w-md mx-auto min-h-screen relative pb-32">
    <header class="sticky top-0 z-20 bg-white/95 backdrop-blur px-4 pt-4 pb-3 flex items-center justify-center gap-3">
      <div class="w-8 h-8 rounded bg-gray-200"></div>
      <div class="text-[17px] font-medium text-gray-700">Общежитие №1</div>
    </header>

    <!-- ЛЕНТА -->
    <main id="screen-feed" class="px-4">
      <section class="grid grid-cols-2 gap-4 mt-2">
        <button type="button" class="tap text-left" onclick="filterCategory('Аренда')">
          <div class="aspect-[4/3] rounded-2xl bg-gray-200 overflow-hidden relative">
            <img src="https://images.unsplash.com/photo-1556740749-887f6717d7e4?w=400&q=80" class="w-full h-full object-cover">
          </div>
          <span class="block text-center text-[14px] mt-1">Аренда</span>
        </button>
        <button type="button" class="tap text-left" onclick="filterCategory('Такси')">
          <div class="aspect-[4/3] rounded-2xl bg-gray-200 overflow-hidden relative">
            <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=400&q=80" class="w-full h-full object-cover">
          </div>
          <span class="block text-center text-[14px] mt-1">Такси</span>
        </button>
        <button type="button" class="tap text-left" onclick="filterCategory('Доставка')">
          <div class="aspect-[4/3] rounded-2xl bg-gray-200 overflow-hidden relative">
            <img src="https://images.unsplash.com/photo-1586528116493-da8b2f9d5f4a?w=400&q=80" class="w-full h-full object-cover">
          </div>
          <span class="block text-center text-[14px] mt-1">Доставка</span>
        </button>
        <button type="button" class="tap text-left" onclick="filterCategory('Другое')">
          <div class="aspect-[4/3] rounded-2xl bg-gray-200 flex items-center justify-center gap-2">
            <span class="w-4 h-4 rounded-full bg-gray-500"></span>
            <span class="w-4 h-4 rounded-full bg-gray-500"></span>
            <span class="w-4 h-4 rounded-full bg-gray-500"></span>
          </div>
          <span class="block text-center text-[14px] mt-1">Другое</span>
        </button>
      </section>

      <div class="mt-5">
        <input id="search-input" type="text" placeholder="Поиск" class="w-full bg-gray-200 rounded-full px-4 py-2.5 outline-none text-[15px]" />
      </div>

      <div id="orders-grid" class="mt-5 grid grid-cols-2 gap-3"></div>
      <div id="empty-state" class="hidden text-center mt-10 text-gray-500">Ничего не найдено</div>
    </main>

    <!-- ФОРМА -->
    <main id="screen-form" class="hidden px-4">
      <div class="mt-2 bg-[#e3e3e3] rounded-3xl p-4 flex flex-col gap-3">
        <input id="ad-title" type="text" maxlength="120" placeholder="Заголовок"
               class="w-full rounded-2xl bg-[#8fb4be] text-white placeholder:text-white/80 p-3 outline-none" />
        <textarea id="ad-description" rows="5" maxlength="2000" placeholder="Описание"
                  class="w-full resize-none rounded-2xl bg-[#8fb4be] text-white placeholder:text-white/80 p-3 outline-none"></textarea>
        <select id="ad-type" class="w-full bg-white border border-gray-800 rounded-full px-4 py-2.5 outline-none">
          <option value="" selected disabled>Выберите тип</option>
          <option value="Аренда">Аренда</option>
          <option value="Такси">Такси</option>
          <option value="Доставка">Доставка</option>
          <option value="Другое">Другое</option>
        </select>
        <input id="ad-price" type="number" min="0" step="1" inputmode="numeric" placeholder="Цена"
               class="w-full bg-white border border-gray-800 rounded-full px-4 py-2.5 outline-none" />
        <p id="price-error" class="hidden -mt-1 text-sm text-red-600">Цена не может быть отрицательной.</p>
        <button id="publish-btn" disabled
                class="tap w-full bg-[#4a7c8c] text-white rounded-full py-3 font-medium disabled:opacity-40">
          Опубликовать
        </button>
      </div>
    </main>

    <!-- ПРОФИЛЬ -->
    <main id="screen-profile" class="hidden px-4">
      <div class="bg-gray-100 rounded-3xl p-5 flex flex-col items-center gap-3 text-center border border-gray-200">
        <div id="user-avatar" class="w-20 h-20 rounded-full bg-[#4a7c8c] text-white flex items-center justify-center text-3xl font-bold">?</div>
        <div>
          <h2 id="profile-name" class="text-xl font-bold">Имя пользователя</h2>
          <p id="profile-username" class="text-gray-500 text-sm">@username</p>
        </div>
        <div class="w-full mt-2 flex gap-2">
          <input id="profile-room" type="text" placeholder="№ комнаты (напр. 412)"
                 class="flex-1 bg-white border border-gray-300 rounded-xl px-4 py-2 text-sm outline-none" />
          <button id="save-room-btn" class="bg-[#4a7c8c] text-white px-4 py-2 rounded-xl text-sm font-medium tap">Сохранить</button>
        </div>
      </div>

      <h3 class="font-bold text-lg mt-6 mb-3">Мои объявления</h3>
      <div id="my-orders-list" class="flex flex-col gap-3"></div>
    </main>
  </div>

  <!-- ПОЛНАЯ ИНФОРМАЦИЯ -->
  <div id="detail-screen" class="hidden fixed inset-0 z-50 bg-white">
    <div class="max-w-md mx-auto h-full flex flex-col">
      <div class="px-4 pt-4 pb-3 flex items-center gap-3 border-b border-gray-100">
        <button id="detail-back" class="tap w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center" type="button" aria-label="Назад">
          <span class="text-2xl leading-none">‹</span>
        </button>
        <div class="font-semibold">Объявление</div>
      </div>

      <div id="detail-content" class="modal-scroll px-4 py-4"></div>
    </div>
  </div>

  <!-- ТОСТ -->
  <div id="toast"
       class="hidden fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] bg-gray-900 text-white rounded-full px-4 py-2 text-sm shadow-lg">
  </div>

  <!-- НИЖНЯЯ НАВИГАЦИЯ -->
  <div id="bottom-nav" class="fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-sm border-t border-gray-100">
    <div class="max-w-md mx-auto flex items-stretch safe-bottom">
      <button id="tab-feed" type="button" class="tap flex-1 flex flex-col items-center gap-1 pt-2.5 pb-1.5 text-[#4a7c8c]">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/>
          <rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/>
        </svg>
        <span class="text-[11px] font-medium">Лента</span>
      </button>

      <button id="tab-form" type="button" class="tap flex-1 flex flex-col items-center gap-1 pt-2.5 pb-1.5 text-gray-400">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
        </svg>
        <span class="text-[11px] font-medium">Разместить</span>
      </button>

      <button id="tab-profile" type="button" class="tap flex-1 flex flex-col items-center gap-1 pt-2.5 pb-1.5 text-gray-400">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.6 3.6-6 8-6s8 2.4 8 6"/>
        </svg>
        <span class="text-[11px] font-medium">Профиль</span>
      </button>
    </div>
  </div>

<script>
  const API_URL = "http://127.0.0.1:8000";

  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const tgUser = tg?.initDataUnsafe?.user;
  const currentUser = {
    id: tgUser?.id || 999999,
    name: tgUser?.first_name || 'Локальный Пользователь',
    username: tgUser?.username ? `@${tgUser.username}` : '@no_username'
  };

  const screenFeed = document.getElementById('screen-feed');
  const screenForm = document.getElementById('screen-form');
  const screenProfile = document.getElementById('screen-profile');

  const tabFeed = document.getElementById('tab-feed');
  const tabForm = document.getElementById('tab-form');
  const tabProfile = document.getElementById('tab-profile');

  const ordersGrid = document.getElementById('orders-grid');
  const searchInput = document.getElementById('search-input');
  const emptyState = document.getElementById('empty-state');

  const adTitle = document.getElementById('ad-title');
  const adDescription = document.getElementById('ad-description');
  const adType = document.getElementById('ad-type');
  const adPrice = document.getElementById('ad-price');
  const priceError = document.getElementById('price-error');
  const publishBtn = document.getElementById('publish-btn');

  const profileName = document.getElementById('profile-name');
  const profileUsername = document.getElementById('profile-username');
  const profileRoom = document.getElementById('profile-room');
  const userAvatar = document.getElementById('user-avatar');
  const saveRoomBtn = document.getElementById('save-room-btn');
  const myOrdersList = document.getElementById('my-orders-list');

  const detailScreen = document.getElementById('detail-screen');
  const detailBack = document.getElementById('detail-back');
  const detailContent = document.getElementById('detail-content');
  const bottomNav = document.getElementById('bottom-nav');
  const toast = document.getElementById('toast');

  let orders = [];
  let activeCategory = null;
  let currentScreen = 'feed';
  let detailOrderId = null;
  let toastTimer = null;

  function esc(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.remove('hidden');
    toastTimer = setTimeout(() => toast.classList.add('hidden'), 2800);
  }

  async function apiFetch(path, options = {}) {
    const res = await fetch(`${API_URL}${path}`, options);
    if (!res.ok) {
      let detail = 'Ошибка запроса';
      try {
        const data = await res.json();
        detail = data.detail || detail;
      } catch (_) {}
      throw new Error(detail);
    }
    return res.json();
  }

  async function fetchOrders() {
    try {
      orders = await apiFetch('/orders');
      renderOrders();
    } catch (e) {
      console.error(e);
      showToast('Не удалось загрузить ленту');
    }
  }

  function renderOrders() {
    const query = searchInput.value.trim().toLowerCase();
    const filtered = orders.filter(o => {
      const matchQuery = `${o.title} ${o.description} ${o.author} ${o.price}`.toLowerCase().includes(query);
      const matchCategory = activeCategory ? o.type === activeCategory : true;
      return matchQuery && matchCategory;
    });

    ordersGrid.innerHTML = '';
    emptyState.classList.toggle('hidden', filtered.length > 0);

    filtered.forEach(order => {
      const isOwn = Number(order.author_id) === Number(currentUser.id);
      ordersGrid.innerHTML += `
        <button type="button" onclick="openOrder(${order.id})"
          class="tap text-left bg-[#bcbcbc] rounded-2xl p-3.5 min-h-[165px] flex flex-col justify-between w-full">
          <div>
            <div class="flex items-start justify-between gap-2">
              <p class="font-semibold text-[15px] leading-5 line-clamp-2">${esc(order.title)}</p>
              ${isOwn ? '<span class="shrink-0 text-[10px] bg-white/70 rounded-full px-2 py-1">Моё</span>' : ''}
            </div>
            <p class="text-[13px] text-gray-700 mt-1 line-clamp-3">${esc(order.description)}</p>
          </div>
          <div class="space-y-0.5 mt-2">
            <p class="text-[12px] text-gray-700">👤 ${esc(order.author)}</p>
            <p class="text-[12px] text-gray-600">📌 ${esc(order.type)}</p>
            <div class="flex items-center justify-between gap-2">
              <p class="text-[13px] text-green-700 font-medium">${Number(order.price).toLocaleString('ru-RU')} ₽</p>
              <p class="text-[12px] text-gray-700">🙋 ${order.response_count || 0}</p>
            </div>
          </div>
        </button>`;
    });
  }

  window.filterCategory = function(cat) {
    activeCategory = activeCategory === cat ? null : cat;
    renderOrders();
  };

  searchInput.addEventListener('input', renderOrders);

  const tabs = { feed: tabFeed, form: tabForm, profile: tabProfile };

  function switchScreen(screen) {
    currentScreen = screen;
    screenFeed.classList.toggle('hidden', screen !== 'feed');
    screenForm.classList.toggle('hidden', screen !== 'form');
    screenProfile.classList.toggle('hidden', screen !== 'profile');

    Object.entries(tabs).forEach(([key, btn]) => {
      btn.classList.toggle('text-[#4a7c8c]', key === screen);
      btn.classList.toggle('text-gray-400', key !== screen);
    });

    if (screen === 'profile') loadMyOrders();
    window.scrollTo(0, 0);
  }

  tabFeed.addEventListener('click', () => switchScreen('feed'));
  tabForm.addEventListener('click', () => switchScreen('form'));
  tabProfile.addEventListener('click', () => switchScreen('profile'));

  function checkForm() {
    const price = adPrice.value.trim();
    const validPrice = price !== '' && Number(price) >= 0 && Number.isFinite(Number(price));
    const hasText = adTitle.value.trim() && adDescription.value.trim() && adType.value;
    publishBtn.disabled = !(hasText && validPrice);
    priceError.classList.toggle('hidden', price === '' || validPrice);
  }

  [adTitle, adDescription, adPrice].forEach(el => el.addEventListener('input', checkForm));
  adType.addEventListener('change', checkForm);

  adPrice.addEventListener('input', () => {
    if (adPrice.value !== '' && Number(adPrice.value) < 0) adPrice.value = 0;
    checkForm();
  });

  publishBtn.addEventListener('click', async () => {
    const price = Number(adPrice.value);
    if (price < 0 || !Number.isFinite(price)) {
      priceError.classList.remove('hidden');
      return;
    }

    try {
      await apiFetch('/add_order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: adTitle.value.trim(),
          description: adDescription.value.trim(),
          type: adType.value,
          price,
          author: currentUser.name,
          author_id: currentUser.id
        })
      });

      adTitle.value = '';
      adDescription.value = '';
      adType.value = '';
      adPrice.value = '';
      priceError.classList.add('hidden');
      checkForm();
      switchScreen('feed');
      await fetchOrders();
      showToast('Объявление опубликовано');
    } catch (e) {
      showToast(e.message || 'Не удалось опубликовать объявление');
    }
  });

  async function openOrder(orderId) {
    detailOrderId = orderId;
    detailContent.innerHTML = '<div class="py-16 text-center text-gray-400">Загрузка…</div>';
    detailScreen.classList.remove('hidden');
    bottomNav.classList.add('hidden');
    window.scrollTo(0, 0);

    try {
      const order = await apiFetch(`/orders/${orderId}?viewer_id=${currentUser.id}`);
      renderOrderDetail(order);
      tg?.BackButton?.show();
      tg?.BackButton?.onClick(closeOrder);
    } catch (e) {
      detailContent.innerHTML = `<div class="py-16 text-center text-red-500">${esc(e.message)}</div>`;
    }
  }

  function renderOrderDetail(order) {
    const isOwner = Number(order.author_id) === Number(currentUser.id);
    const hasResponded = !!order.current_user_responded;

    const responseButton = isOwner
      ? `<div class="rounded-2xl bg-gray-100 p-4 text-sm text-gray-600">Это ваше объявление. Здесь отображаются все исполнители, которые согласились взять заказ.</div>`
      : hasResponded
        ? `<button type="button" onclick="refuseOrder(${order.id})"
             class="tap w-full rounded-full border-2 border-red-300 text-red-600 py-3 font-semibold">
             Отказаться от выполнения
           </button>`
        : `<button type="button" onclick="respondToOrder(${order.id})"
             class="tap w-full rounded-full bg-[#4a7c8c] text-white py-3 font-semibold">
             Готов выполнить заказ
           </button>`;

    const responders = order.responders?.length
      ? order.responders.map((r, index) => `
          <div class="flex items-center gap-3 ${index ? 'border-t border-gray-100 pt-3 mt-3' : ''}">
            <div class="w-10 h-10 rounded-full bg-[#4a7c8c] text-white flex items-center justify-center font-semibold">
              ${esc((r.name || '?').charAt(0).toUpperCase())}
            </div>
            <div class="min-w-0">
              <p class="font-medium">${esc(r.name)}</p>
              <p class="text-sm text-gray-500">${esc(r.username || '@no_username')}${r.room ? ` · комната ${esc(r.room)}` : ''}</p>
            </div>
          </div>`).join('')
      : '<p class="text-sm text-gray-400">Пока никто не откликнулся.</p>';

    detailContent.innerHTML = `
      <div class="flex flex-wrap gap-2 mb-3">
        <span class="bg-gray-100 rounded-full px-3 py-1 text-xs font-medium">${esc(order.type)}</span>
        <span class="bg-green-100 text-green-700 rounded-full px-3 py-1 text-xs font-medium">${Number(order.price).toLocaleString('ru-RU')} ₽</span>
      </div>

      <h1 class="text-2xl font-bold leading-tight">${esc(order.title)}</h1>
      <p class="mt-4 whitespace-pre-wrap text-[15px] leading-6 text-gray-700">${esc(order.description)}</p>

      <div class="mt-6 rounded-2xl bg-gray-100 p-4">
        <p class="text-xs text-gray-500 uppercase tracking-wide">Заказчик</p>
        <p class="mt-1 font-semibold">${esc(order.author)}</p>
        ${order.author_username ? `<p class="text-sm text-gray-500">${esc(order.author_username)}</p>` : ''}
      </div>

      <div class="mt-5">
        ${responseButton}
      </div>

      <section class="mt-7">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-lg">Откликнулись</h2>
          <span class="text-sm text-gray-500">${order.response_count || 0}</span>
        </div>
        <div class="mt-3 rounded-2xl bg-gray-50 border border-gray-100 p-4">
          ${responders}
        </div>
      </section>
    `;
  }

  window.respondToOrder = async function(orderId) {
    try {
      const result = await apiFetch(`/orders/${orderId}/respond`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          telegram_id: currentUser.id,
          name: currentUser.name,
          username: currentUser.username
        })
      });
      tg?.HapticFeedback?.notificationOccurred('success');
      showToast(result.notification_sent ? 'Отклик отправлен владельцу' : 'Отклик сохранён');
      await openOrder(orderId);
      await fetchOrders();
    } catch (e) {
      tg?.HapticFeedback?.notificationOccurred('error');
      showToast(e.message || 'Не удалось отправить отклик');
    }
  };

  window.refuseOrder = async function(orderId) {
    try {
      await apiFetch(`/orders/${orderId}/respond`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telegram_id: currentUser.id })
      });
      tg?.HapticFeedback?.notificationOccurred('success');
      showToast('Вы отказались от выполнения');
      await openOrder(orderId);
      await fetchOrders();
    } catch (e) {
      showToast(e.message || 'Не удалось отказаться');
    }
  };

  function closeOrder() {
    detailScreen.classList.add('hidden');
    bottomNav.classList.remove('hidden');
    detailOrderId = null;
    tg?.BackButton?.hide();
  }

  detailBack.addEventListener('click', closeOrder);

  async function initProfile() {
    profileName.textContent = currentUser.name;
    profileUsername.textContent = currentUser.username;
    userAvatar.textContent = currentUser.name[0]?.toUpperCase() || '?';

    try {
      const data = await apiFetch('/sync_user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          telegram_id: currentUser.id,
          name: currentUser.name,
          username: currentUser.username
        })
      });
      profileRoom.value = data.room || '';
    } catch (e) {
      console.error(e);
    }
  }

  saveRoomBtn.addEventListener('click', async () => {
    try {
      await apiFetch('/update_profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          telegram_id: currentUser.id,
          room: profileRoom.value.trim()
        })
      });
      showToast('Профиль обновлён');
    } catch (e) {
      showToast('Не удалось обновить профиль');
    }
  });

  async function loadMyOrders() {
    try {
      const myOrders = await apiFetch(`/my_orders/${currentUser.id}`);
      myOrdersList.innerHTML = '';

      if (myOrders.length === 0) {
        myOrdersList.innerHTML = `<p class="text-gray-400 text-sm">У вас нет активных объявлений</p>`;
        return;
      }

      myOrders.forEach(o => {
        const archiveStyles = o.is_archived ? 'opacity-60 bg-gray-50' : 'bg-gray-100';
        const archiveBadge = o.is_archived ? '<span class="text-orange-600 font-bold ml-2">(В архиве)</span>' : '';
        const restoreBtn = o.is_archived
          ? `<button onclick="restoreMyOrder(${o.id})" class="text-green-600 bg-green-100 rounded-lg text-xs font-semibold px-3 py-1.5 tap mb-1">Восстановить</button>`
          : '';

        myOrdersList.innerHTML += `
          <div class="${archiveStyles} rounded-2xl p-3.5 flex justify-between items-center border border-gray-200 transition-all">
            <button type="button" onclick="openOrder(${o.id})" class="text-left pr-2 min-w-0">
              <p class="font-medium text-sm">${esc(o.title)}</p>
              <p class="text-xs text-gray-500 mt-1">${esc(o.type)} • ${Number(o.price).toLocaleString('ru-RU')} ₽ • 🙋 ${o.response_count || 0} ${archiveBadge}</p>
            </button>
            <div class="flex flex-col items-end shrink-0">
              ${restoreBtn}
              <button onclick="deleteMyOrder(${o.id})" class="text-red-500 bg-red-50 rounded-lg text-xs font-semibold px-3 py-1.5 tap">Удалить</button>
            </div>
          </div>`;
      });
    } catch (e) {
      console.error(e);
      showToast('Ошибка загрузки своих объявлений');
    }
  }

  window.restoreMyOrder = async function(orderId) {
    try {
      await apiFetch(`/restore_order/${orderId}`, { method: 'POST' });
      await loadMyOrders();
      await fetchOrders();
    } catch (e) {
      showToast('Не удалось восстановить объявление');
    }
  };

  window.deleteMyOrder = async function(orderId) {
    if (!confirm('Удалить объявление?')) return;
    try {
      await apiFetch(`/delete_order/${orderId}`, { method: 'DELETE' });
      await loadMyOrders();
      await fetchOrders();
    } catch (e) {
      showToast('Не удалось удалить объявление');
    }
  };

  initProfile();
  fetchOrders();
  checkForm();
</script>
</body>
</html>
