<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Общежитие №1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; }
  select { -webkit-appearance: none; appearance: none; }
  .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
  .tap:active { transform: scale(0.96); opacity: 0.85; }
</style>
</head>
<body class="bg-white text-gray-900 overflow-x-hidden">
  <div class="max-w-md mx-auto min-h-screen relative pb-32">
    <header class="sticky top-0 z-20 bg-white/95 backdrop-blur px-4 pt-4 pb-3 flex items-center justify-center gap-3">
      <div class="w-8 h-8 rounded bg-gray-200"></div>
      <div class="text-[17px] font-medium text-gray-700">Общежитие №1</div>
    </header>

    <main id="screen-feed" class="px-4">
      <section class="grid grid-cols-2 gap-4 mt-2">
        <button type="button" class="tap text-left" onclick="filterCategory('Аренда')">
          <div class="aspect-[4/3] rounded-2xl bg-gray-200 overflow-hidden relative">
            <img src="https://images.unsplash.com/photo-1556740749-887f6717d7e4?w=400&q=80" class="w-full h-full object-cover">
          </div>
          <span class="block text-center text-[14px] mt-1">Аренда</span>
        </button>
        <button type="button" class="tap text-left" onclick="filterCategory('Такси')">
          <div class="aspect-[4/3] rounded-2xl bg-gray-200 overflow-hidden relative">
             <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=400&q=80" class="w-full h-full object-cover">
          </div>
          <span class="block text-center text-[14px] mt-1">Такси</span>
        </button>
        <button type="button" class="tap text-left" onclick="filterCategory('Доставка')">
          <div class="aspect-[4/3] rounded-2xl bg-gray-200 overflow-hidden relative">
            <img src="https://images.unsplash.com/photo-1586528116493-da8b2f9d5f4a?w=400&q=80" class="w-full h-full object-cover">
          </div>
          <span class="block text-center text-[14px] mt-1">Доставка</span>
        </button>
        <button type="button" class="tap text-left" onclick="filterCategory('Другое')">
          <div class="aspect-[4/3] rounded-2xl bg-gray-200 flex items-center justify-center gap-2">
            <span class="w-4 h-4 rounded-full bg-gray-500"></span>
            <span class="w-4 h-4 rounded-full bg-gray-500"></span>
            <span class="w-4 h-4 rounded-full bg-gray-500"></span>
          </div>
          <span class="block text-center text-[14px] mt-1">Другое</span>
        </button>
      </section>

      <div class="mt-5">
        <input id="search-input" type="text" placeholder="Поиск" class="w-full bg-gray-200 rounded-full px-4 py-2.5 outline-none text-[15px]" />
      </div>

      <div id="orders-grid" class="mt-5 grid grid-cols-2 gap-3"></div>
      <div id="empty-state" class="hidden text-center mt-10 text-gray-500">Ничего не найдено</div>
    </main>

    <main id="screen-form" class="hidden px-4">
      <div class="mt-2 bg-[#e3e3e3] rounded-3xl p-4 flex flex-col gap-3">
        <textarea id="ad-text" rows="3" placeholder="Напишите объявление" class="w-full resize-none rounded-2xl bg-[#8fb4be] text-white p-3 outline-none"></textarea>
        <select id="ad-type" class="w-full bg-white border border-gray-800 rounded-full px-4 py-2.5 outline-none">
          <option value="" selected disabled>Выберите тип</option>
          <option value="Аренда">Аренда</option>
          <option value="Такси">Такси</option>
          <option value="Доставка">Доставка</option>
          <option value="Другое">Другое</option>
        </select>
        <div class="flex gap-3">
          <select id="ad-time" class="w-full bg-white border border-gray-800 rounded-full px-4 py-2.5 outline-none">
            <option value="" selected disabled>Время</option>
            <option value="Сейчас">Сейчас</option>
            <option value="Сегодня вечером">Сегодня вечером</option>
            <option value="Завтра">Завтра</option>
          </select>
          <input id="ad-price" type="number" placeholder="Цена" class="w-full bg-white border border-gray-800 rounded-full px-4 py-2.5 outline-none" />
        </div>
        <button id="publish-btn" disabled class="tap w-full bg-[#4a7c8c] text-white rounded-full py-3 font-medium disabled:opacity-40">Опубликовать</button>
      </div>
    </main>
    <!-- ================= ЭКРАН 3: ПРОФИЛЬ ================= -->
    <main id="screen-profile" class="hidden px-4">
      <div class="bg-gray-100 rounded-3xl p-5 flex flex-col items-center gap-3 text-center border border-gray-200">
        <div id="user-avatar" class="w-20 h-20 rounded-full bg-[#4a7c8c] text-white flex items-center justify-center text-3xl font-bold">
          ?
        </div>
        <div>
          <h2 id="profile-name" class="text-xl font-bold">Имя пользователя</h2>
          <p id="profile-username" class="text-gray-500 text-sm">@username</p>
        </div>
        /<!-- Редактирование комнаты -->
        <div class="w-full mt-2 flex gap-2">
          <input id="profile-room" type="text" placeholder="№ комнаты (напр. 412)" class="flex-1 bg-white border border-gray-300 rounded-xl px-4 py-2 text-sm outline-none" />
          <button id="save-room-btn" class="bg-[#4a7c8c] text-white px-4 py-2 rounded-xl text-sm font-medium tap">Сохранить</button>
        </div>
      </div>

      <h3 class="font-bold text-lg mt-6 mb-3">Мои объявления</h3>
      <div id="my-orders-list" class="flex flex-col gap-3"></div>
    </main>
  </div>

  <div class="fixed bottom-0 inset-x-0 z-30 bg-white/80 backdrop-blur-sm">
    <div class="max-w-md mx-auto p-4 safe-bottom">
      <button id="nav-btn" type="button" class="tap w-full bg-[#4a7c8c] text-white rounded-full py-3.5 font-medium shadow-md">Выставить объявление</button>
    </div>
  </div>

<script>
  const API_URL = "http://127.0.0.1:8000"; // На сервере заменишь на адрес Cloudflare

  // 1. Данные из Telegram WebApp API
  const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
  const currentUser = {
    id: tgUser?.id || 999999, // Для тестов в браузере
    name: tgUser?.first_name || 'Локальный Пользователь',
    username: tgUser?.username ? `@${tgUser.username}` : '@no_username'
  };

  // 2. Связка элементов DOM
  const screenFeed = document.getElementById('screen-feed');
  const screenForm = document.getElementById('screen-form');
  const screenProfile = document.getElementById('screen-profile');
  const navBtn = document.getElementById('nav-btn');
  const ordersGrid = document.getElementById('orders-grid');
  const searchInput = document.getElementById('search-input');
  const emptyState = document.getElementById('empty-state');
  
  const adText = document.getElementById('ad-text');
  const adType = document.getElementById('ad-type');
  const adTime = document.getElementById('ad-time');
  const adPrice = document.getElementById('ad-price');
  const publishBtn = document.getElementById('publish-btn');

  const profileName = document.getElementById('profile-name');
  const profileUsername = document.getElementById('profile-username');
  const profileRoom = document.getElementById('profile-room');
  const userAvatar = document.getElementById('user-avatar');
  const saveRoomBtn = document.getElementById('save-room-btn');
  const myOrdersList = document.getElementById('my-orders-list');

  let orders = [];
  let activeCategory = null;
  let currentScreen = 'feed'; // 'feed' | 'form' | 'profile'

  // 3. Загрузка общей ленты
  async function fetchOrders() {
    try {
      const res = await fetch(`${API_URL}/orders`);
      orders = await res.json();
      renderOrders();
    } catch (e) {
      console.error("Ошибка загрузки ленты");
    }
  }

  function renderOrders() {
    const query = searchInput.value.trim().toLowerCase();
    const filtered = orders.filter(o => {
      const matchQuery = `${o.text} ${o.author} ${o.price} ${o.time}`.toLowerCase().includes(query);
      const matchCategory = activeCategory ? o.type === activeCategory : true;
      return matchQuery && matchCategory;
    });

    ordersGrid.innerHTML = '';
    emptyState.classList.toggle('hidden', filtered.length > 0);

    filtered.forEach(order => {
      ordersGrid.innerHTML += `
        <div class="bg-[#bcbcbc] rounded-2xl p-3.5 min-h-[145px] flex flex-col justify-between">
          <p class="font-medium text-[15px]">${order.text}</p>
          <div>
            <p class="text-[13px] text-gray-700 font-medium">👤 ${order.author}</p>
            <p class="text-[13px] text-gray-600">Время: ${order.time}</p>
            <p class="text-[13px] text-green-700 font-medium">Цена: ${order.price} ₽</p>
          </div>
        </div>`;
    });
  }

  window.filterCategory = function(cat) {
    activeCategory = activeCategory === cat ? null : cat;
    renderOrders();
  };
  searchInput.addEventListener('input', renderOrders);

  // 4. Переключение экранов (Лента -> Форма -> Профиль -> Лента)
  navBtn.addEventListener('click', () => {
    if (currentScreen === 'feed') {
      currentScreen = 'form';
      navBtn.textContent = 'К объявлениям';
    } else if (currentScreen === 'form') {
      currentScreen = 'profile';
      navBtn.textContent = 'К ленте объявлений';
      loadMyOrders();
    } else {
      currentScreen = 'feed';
      navBtn.textContent = 'Выставить объявление';
    }

    screenFeed.classList.toggle('hidden', currentScreen !== 'feed');
    screenForm.classList.toggle('hidden', currentScreen !== 'form');
    screenProfile.classList.toggle('hidden', currentScreen !== 'profile');
    window.scrollTo(0, 0);
  });

  // 5. Валидация формы
  function checkForm() {
    publishBtn.disabled = !(adText.value.trim() && adType.value && adTime.value && adPrice.value.trim());
  }
  [adText, adPrice].forEach(el => el.addEventListener('input', checkForm));
  [adType, adTime].forEach(el => el.addEventListener('change', checkForm));

  // 6. Публикация заказа
  publishBtn.addEventListener('click', async () => {
    await fetch(`${API_URL}/add_order`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: adText.value.trim(),
        type: adType.value,
        time: adTime.value,
        price: Number(adPrice.value),
        author: currentUser.name,
        author_id: currentUser.id
      })
    });

    adText.value = ''; adType.value = ''; adTime.value = ''; adPrice.value = '';
    checkForm();
    navBtn.click(); // Возврат в ленту
    fetchOrders();
  });

  // 7. Инициализация профиля
  async function initProfile() {
    profileName.textContent = currentUser.name;
    profileUsername.textContent = currentUser.username;
    userAvatar.textContent = currentUser.name[0].toUpperCase();

    try {
      const res = await fetch(`${API_URL}/sync_user`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          telegram_id: currentUser.id,
          name: currentUser.name,
          username: currentUser.username
        })
      });
      const data = await res.json();
      if (data.room) profileRoom.value = data.room;
    } catch (e) {
      console.error("Ошибка синхронизации профиля");
    }
  }

  saveRoomBtn.addEventListener('click', async () => {
    await fetch(`${API_URL}/update_profile`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        telegram_id: currentUser.id,
        room: profileRoom.value.trim()
      })
    });
    alert("Профиль обновлен!");
  });

  async function loadMyOrders() {
    try {
      const res = await fetch(`${API_URL}/my_orders/${currentUser.id}`);
      const myOrders = await res.json();
      
      myOrdersList.innerHTML = '';
      if (myOrders.length === 0) {
        myOrdersList.innerHTML = `<p class="text-gray-400 text-sm">У вас нет активных объявлений</p>`;
        return;
      }

      myOrders.forEach(o => {
        myOrdersList.innerHTML += `
          <div class="bg-gray-100 rounded-2xl p-3.5 flex justify-between items-center border border-gray-200">
            <div>
              <p class="font-medium text-sm">${o.text}</p>
              <p class="text-xs text-gray-500">${o.type} • ${o.price} ₽</p>
            </div>
            <button onclick="deleteMyOrder(${o.id})" class="text-red-500 text-xs font-semibold p-2 tap">Удалить</button>
          </div>`;
      });
    } catch (e) {
      console.error("Ошибка загрузки своих объявлений");
    }
  }

  window.deleteMyOrder = async function(orderId) {
    if (!confirm("Удалить объявление?")) return;
    await fetch(`${API_URL}/delete_order/${orderId}`, { method: "DELETE" });
    loadMyOrders();
    fetchOrders();
  };

  // Старт приложения
  initProfile();
  fetchOrders();
</script>
</body>
</html>
